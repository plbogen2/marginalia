x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend_blue: &backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: marginalia_backend_blue
    restart: unless-stopped
    expose:
      - "3000"
    mem_limit: 384m
    logging: *default-logging
    devices:
      - "/dev/fuse:/dev/fuse"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Mount a local directory to persist SQLite data and workspace markdown files
      - marginalia_data:/root/.marginalia
      # Mount host SSH credentials so git client can push/pull to secure remote origins
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - VFS_SECRET=${VFS_SECRET:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_USER=${ALLOWED_USER}
      - PARLANDO_URL=http://parlando:8765
    depends_on:
      - parlando

  backend_green:
    <<: *backend
    container_name: marginalia_backend_green

  frontend_blue: &frontend
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: marginalia_frontend_blue
    restart: unless-stopped
    expose:
      - "80"
    mem_limit: 64m
    logging: *default-logging

  frontend_green:
    <<: *frontend
    container_name: marginalia_frontend_green

  parlando:
    build:
      context: ./parlando
      dockerfile: Dockerfile
    container_name: marginalia_parlando
    restart: unless-stopped
    expose:
      - "8765"
    mem_limit: 256m
    logging: *default-logging
    environment:
      - PORT=8765
      - GEMINI_API_KEY=${GEMINI_API_KEY}

  caddy:
    image: caddy:2-alpine
    container_name: marginalia_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 96m
    logging: *default-logging
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - parlando

volumes:
  marginalia_data:
  caddy_data:
  caddy_config:
