version: '3.8'

services:
  marginalia:
    build: .
    container_name: marginalia
    ports:
      - "3000:3000"
    devices:
      - "/dev/fuse:/dev/fuse"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Mount a local directory to persist SQLite data and workspace markdown files
      - marginalia_data:/root/.marginalia
      # Mount host SSH credentials so git client can push/pull to secure remote origins
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_USER=${ALLOWED_USER}

volumes:
  marginalia_data: