version: '3.8'

services:
  marginalia:
    build: .
    container_name: marginalia
    expose:
      - "3000"
    devices:
      - "/dev/fuse:/dev/fuse"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      # Mount a local directory to persist SQLite data and workspace markdown files
      - marginalia_data:/root/.marginalia
      # Mount host SSH credentials so git client can push/pull to secure remote origins
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_USER=${ALLOWED_USER}
      - PARLANDO_URL=http://parlando:8765
    depends_on:
      - parlando

  parlando:
    build:
      context: ./parlando
      dockerfile: Dockerfile
    container_name: marginalia_parlando
    restart: unless-stopped
    expose:
      - "8765"
    environment:
      - PORT=8765

  caddy:
    image: caddy:2-alpine
    container_name: marginalia_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - marginalia

volumes:
  marginalia_data:
  caddy_data:
  caddy_config:
