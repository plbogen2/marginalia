version: '3.8'

services:
  marginalia:
    build: .
    container_name: marginalia
    ports:
      - "3000:3000"
    volumes:
      # Mount a local directory to persist SQLite data and workspace markdown files
      - marginalia_data:/root/.marginalia
      # Mount host SSH credentials so git client can push/pull to secure remote origins
      - ~/.ssh:/root/.ssh:ro
    environment:
      - PORT=${PORT:-3000}
      - SESSION_SECRET=${SESSION_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - ALLOWED_USER=${ALLOWED_USER}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$TUNNEL_TOKEN" ]; then
          exec cloudflared tunnel --no-autoupdate run
        else
          exec cloudflared tunnel --no-autoupdate --url http://marginalia:3000
        fi
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

volumes:
  marginalia_data: