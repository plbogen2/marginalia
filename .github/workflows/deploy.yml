name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: SSH and Deploy to VM
      uses: appleboy/ssh-action@v1.2.0
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
        GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        ALLOWED_USER: ${{ secrets.ALLOWED_USER }}
        CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      with:
        host: ${{ vars.SSH_HOST }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        port: 22
        envs: GEMINI_API_KEY,GH_CLIENT_ID,GH_CLIENT_SECRET,ALLOWED_USER,CLOUDFLARE_TUNNEL_TOKEN
        script: |
          if [ -d "marginalia" ]; then
            cd marginalia
            echo "--> Pulling latest changes..."
            git pull origin main
            cp scripts/setup_vm.sh $HOME/setup_vm.sh 2>/dev/null && chmod +x $HOME/setup_vm.sh || true
            
            echo "--> Updating environment configuration..."
            SESSION_SECRET=""
            if [ -f ".env" ]; then
              SESSION_SECRET=$(grep '^SESSION_SECRET=' .env | cut -d '=' -f2-)
            fi
            if [ -z "$SESSION_SECRET" ]; then
              SESSION_SECRET=$(openssl rand -hex 24)
            fi

            printf "PORT=3000\nSESSION_SECRET=%s\nGEMINI_API_KEY=%s\nGITHUB_CLIENT_ID=%s\nGITHUB_CLIENT_SECRET=%s\nALLOWED_USER=%s\nCLOUDFLARE_TUNNEL_TOKEN=%s\n" "$SESSION_SECRET" "$GEMINI_API_KEY" "$GH_CLIENT_ID" "$GH_CLIENT_SECRET" "$ALLOWED_USER" "$CLOUDFLARE_TUNNEL_TOKEN" > .env

            echo "--> Rebuilding and starting containers..."
            sudo docker-compose down || true
            sudo docker-compose up -d --build
          else
            echo "--> Repository folder 'marginalia' not found. Please run scripts/setup_vm.sh on the host first!"
            exit 1
          fi