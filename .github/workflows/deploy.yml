name: Deploy to Oracle Cloud VM

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Auto Release"]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: deploy-to-oracle-vm
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: SSH and Deploy to VM
      uses: appleboy/ssh-action@v1.2.0
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID }}
        GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET }}
        ALLOWED_USER: ${{ secrets.ALLOWED_USER }}
      with:
        host: ${{ vars.SSH_HOST }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        port: 22
        envs: GEMINI_API_KEY,GH_CLIENT_ID,GH_CLIENT_SECRET,ALLOWED_USER
        script: |
          if [ -d "marginalia" ]; then
            cd marginalia
            echo "--> Pulling latest changes and inspecting delta..."
            PREV_REV=$(git rev-parse HEAD 2>/dev/null || echo "")
            git pull origin main
            git submodule sync
            git submodule update --init --recursive
            NEW_REV=$(git rev-parse HEAD)
            cp scripts/setup_vm.sh $HOME/setup_vm.sh 2>/dev/null && chmod +x $HOME/setup_vm.sh || true
            
            echo "--> Updating environment configuration..."
            SESSION_SECRET=""
            if [ -f ".env" ]; then
              SESSION_SECRET=$(grep '^SESSION_SECRET=' .env | cut -d '=' -f2-)
            fi
            if [ -z "$SESSION_SECRET" ]; then
              SESSION_SECRET=$(openssl rand -hex 24)
            fi

            printf "PORT=3000\nSESSION_SECRET=%s\nGEMINI_API_KEY=%s\nGITHUB_CLIENT_ID=%s\nGITHUB_CLIENT_SECRET=%s\nALLOWED_USER=%s\nPARLANDO_URL=http://parlando:8765\n" "$SESSION_SECRET" "$GEMINI_API_KEY" "$GH_CLIENT_ID" "$GH_CLIENT_SECRET" "$ALLOWED_USER" > .env

            echo "--> Ensuring cloudtop SSH public key is authorized..."
            PUB_KEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFOHI2B0C27WzCvcJyWRfERauJNAAUr15rE1E7jAqBzb plbogen-jetski"
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
            if ! grep -q -F "$PUB_KEY" ~/.ssh/authorized_keys; then
              echo "$PUB_KEY" >> ~/.ssh/authorized_keys
              echo "Cloudtop SSH public key added to authorized_keys."
            fi

            echo "--> Configuring firewall for Docker and Host ports..."
            for port in 80 443 3000 8765; do
              sudo iptables -I INPUT 1 -p tcp --dport $port -j ACCEPT 2>/dev/null || true
              sudo iptables -I FORWARD 1 -p tcp --dport $port -j ACCEPT 2>/dev/null || true
            done
            sudo iptables -I FORWARD 1 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
            sudo iptables -N DOCKER-USER 2>/dev/null || true
            sudo iptables -I DOCKER-USER 1 -j ACCEPT 2>/dev/null || true
            if command -v netfilter-persistent &> /dev/null; then
              sudo netfilter-persistent save 2>/dev/null || true
            fi
            rm -f docker-compose.override.yml 2>/dev/null || true

            echo "--> Inspecting delta between $PREV_REV and $NEW_REV..."
            BUILD_BACKEND=false
            BUILD_FRONTEND=false
            BUILD_PARLANDO=false
            RELOAD_CADDY=false

            if [ -z "$PREV_REV" ] || [ "$PREV_REV" = "$NEW_REV" ]; then
              echo "--> No previous revision or manual dispatch, rebuilding all active components..."
              BUILD_BACKEND=true
              BUILD_FRONTEND=true
              BUILD_PARLANDO=true
              RELOAD_CADDY=true
            else
              CHANGED_FILES=$(git diff --name-only "$PREV_REV" "$NEW_REV" 2>/dev/null || echo "")
              echo "Changed files:"
              echo "$CHANGED_FILES"

              if echo "$CHANGED_FILES" | grep -q -E '^backend/|CHANGELOG\.md|Dockerfile\.backend'; then
                BUILD_BACKEND=true
              fi
              if echo "$CHANGED_FILES" | grep -q -E '^frontend/|Dockerfile\.frontend'; then
                BUILD_FRONTEND=true
              fi
              if echo "$CHANGED_FILES" | grep -q -E '^parlando/'; then
                BUILD_PARLANDO=true
              fi
              if echo "$CHANGED_FILES" | grep -q -E 'Caddyfile|docker-compose\.yml'; then
                RELOAD_CADDY=true
                BUILD_BACKEND=true
                BUILD_FRONTEND=true
              fi
            fi

            # Check if any container is not running yet
            if ! sudo docker ps --format '{{.Names}}' | grep -q marginalia_backend; then
              BUILD_BACKEND=true
            fi
            if ! sudo docker ps --format '{{.Names}}' | grep -q marginalia_frontend; then
              BUILD_FRONTEND=true
            fi
            if ! sudo docker ps --format '{{.Names}}' | grep -q marginalia_parlando; then
              BUILD_PARLANDO=true
            fi

            echo "--> Build Plan: backend=$BUILD_BACKEND, frontend=$BUILD_FRONTEND, parlando=$BUILD_PARLANDO, reload_caddy=$RELOAD_CADDY"

            # Zero-downtime rolling updates: build while old containers run, then hot-swap
            if [ "$BUILD_PARLANDO" = true ]; then
              echo "--> Building Parlando container..."
              sudo docker-compose build parlando
              sudo docker-compose up -d --no-deps parlando
            fi

            chmod +x scripts/hot_swap.sh
            if [ "$BUILD_BACKEND" = true ] && [ "$BUILD_FRONTEND" = true ]; then
              echo "--> Executing full hot swap for Backend and Frontend..."
              ./scripts/hot_swap.sh all
            elif [ "$BUILD_BACKEND" = true ]; then
              echo "--> Executing hot swap for Backend API..."
              ./scripts/hot_swap.sh backend
            elif [ "$BUILD_FRONTEND" = true ]; then
              echo "--> Executing hot swap for Frontend Web App..."
              ./scripts/hot_swap.sh frontend
            elif [ "$RELOAD_CADDY" = true ]; then
              echo "--> Reloading Caddy reverse proxy..."
              sudo docker exec marginalia_caddy caddy reload --config /etc/caddy/Caddyfile || sudo docker-compose restart caddy
            fi
            
            echo "--> Container status:"
            sudo docker ps -a
            
            echo "--> Checking Caddy logs:"
            sudo docker logs --tail 30 marginalia_caddy || true

            echo "--> Testing connection:"
            curl -I https://64-181-248-211.nip.io || curl -I http://127.0.0.1:80 || true
          else
            echo "--> Repository folder 'marginalia' not found. Please run scripts/setup_vm.sh on the host first!"
            exit 1
          fi
